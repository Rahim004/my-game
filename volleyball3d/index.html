<script>
'use strict';
// ================= ДАННЫЕ =================
const HX=8,HZ=4,NETH=2.24,BR=.26,GB=13,GP=18,SPEED=6.4,JUMPV=7.2,REACH=1.15,STEP=1/120;
let WIN=9;
const DIFF=[
  {name:'Новичок',k:[.3,1.05],react:.28,block:.3,spd:.85,rx:.42},
  {name:'Игрок',  k:[.2,.8],  react:.16,block:.6,spd:1,rx:.26},
  {name:'Мастер', k:[.08,.5], react:.06,block:.85,spd:1,rx:.14}];
// sp: thunder — молниеносный удар, ghost — мяч исчезает, wall — стена у сетки
const CH={
  rei: {id:'rei', name:'РЭЙ', num:'10',skin:'#f6d2ac',hair:'#e9eef8',hair2:'#2f7bff',eye:'#38a8ff',style:'spiky',sp:'thunder',spName:'ГРОМ',   desc:'Молниеносный удар в прыжке',col:'#38a8ff',pic:'assets/p10.jpg'},
  saki:{id:'saki',name:'САКИ',num:'7', skin:'#ffe0c8',hair:'#ff8fc7',hair2:'#ff4f9a',eye:'#ff5fa8',style:'twin', sp:'ghost',  spName:'ФАНТОМ', desc:'Мяч исчезает прямо в полёте',col:'#ff6fb5'},
  aris:{id:'aris',name:'АРИС',num:'4', skin:'#c98f62',hair:'#242433',hair2:'#ffd23f',eye:'#ffcc33',style:'band', sp:'wall',   spName:'СТЕНА',  desc:'Непробиваемая стена у сетки',col:'#ffd23f',pic:'assets/p4.jpg'},
  rin: {id:'rin', name:'РИН', num:'1', skin:'#f0c39a',hair:'#6a2c1c',hair2:'#ff6a3d',eye:'#ff7a3a',style:'spiky',sp:'thunder',spName:'ЯРОСТЬ', col:'#ff6a3d'},
  bo:  {id:'bo',  name:'БО',  num:'8', skin:'#e2ad80',hair:'#b9bfd0',hair2:'#b9bfd0',eye:'#7a8cff',style:'band', sp:'ghost',  spName:'ТУМАН',  col:'#9fb0ff'},
  yuki:{id:'yuki',name:'ЮКИ', num:'3', skin:'#fbe3d3',hair:'#c9a7ff',hair2:'#7b4dff',eye:'#9d6bff',style:'long', sp:'ghost',  spName:'ПРИЗРАК',col:'#b58bff'},
  kage:{id:'kage',name:'КАГЭ',num:'9', skin:'#d9a67a',hair:'#1a1a30',hair2:'#a35bff',eye:'#c58bff',style:'swoop',sp:'thunder',spName:'ТЕНЬ',   col:'#a35bff'},
  ryu: {id:'ryu', name:'РЮ',  num:'11',skin:'#f0c39a',hair:'#ffcf40',hair2:'#ff6a00',eye:'#ff3b2f',style:'spiky',sp:'thunder',spName:'ДРАКОН', col:'#ffb02e',boss:1},
  mei: {id:'mei', name:'МЭЙ', num:'6', skin:'#fbe0c9',hair:'#ff9a5a',hair2:'#ffd04a',eye:'#ff8a3a',style:'twin', sp:'ghost',  spName:'МИРАЖ',  col:'#ff9a5a'},
  tetsu:{id:'tetsu',name:'ТЭЦУ',num:'2', skin:'#caa07a',hair:'#2a2a3a',hair2:'#7b4dff',eye:'#9d6bff',style:'band', sp:'thunder',spName:'ОБСИДИАН',col:'#8f6bff'},
  jin: {id:'jin', name:'ДЖИН', num:'12',skin:'#e0b48a',hair:'#8a2a1f',hair2:'#ff6a00',eye:'#ffcf40',style:'swoop',sp:'wall',   spName:'БАСТИОН', col:'#ff9d2e'},
  kai: {id:'kai', name:'КАЙ', num:'5', skin:'#d9a67a',hair:'#d7442c',hair2:'#d7442c',eye:'#ffcf40',style:'swoop',sp:'ghost',  spName:'ПЕПЕЛ',  col:'#ff7a3d'}};
const ACES=['rei','saki','aris'];
const STAGES=[
  {team:'ПРИБОЙ',  c:'#ff5a4d',s:'#8f1d2c',diff:0,chars:['rin','bo','mei']},
  {team:'ТЕНИ',    c:'#a35bff',s:'#3b1a78',diff:1,chars:['yuki','kage','tetsu']},
  {team:'ДРАКОНЫ', c:'#ffb02e',s:'#7a3b00',diff:2,chars:['ryu','kai','jin']}];
const BLUE={n:'ШТОРМ',c:'#1fb6ff',s:'#0b4f8a'};
for(const k in CH)if(CH[k].pic){const i=new Image();i.src=CH[k].pic;CH[k].img=i;}
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const TOT={points:[0,0],maxTouches:0,spikes:0,blocks:0,supers:0,nan:0}; // для самопроверки
let S,mute=false,camera=null,scene=null;
let screen='select',sel=0,stage=0,screenT=0,best=0,touchMode=false;
try{best=+localStorage.getItem('storm_best')||0;}catch(e){}
const keys={},input={hit:false,sup:false},joy={id:-1,x:0,y:0,ox:0,oy:0},tb={};

// ================= СИМУЛЯЦИЯ (метры, y — вверх, сетка в x=0) =================
function mk(team,role,ch){return{team,role,human:false,ch,x:0,y:0,z:0,vx:0,vy:0,vz:0,onGround:true,swing:0,cool:0,run:0,k:.5,lastD:1e9,jumpId:0,seen:-1,blockAt:1e9,anim:'',animT:0,animFrom:0,animSpd:1,animNew:false};}
function rot3(a,k){return[a[k],a[(k+1)%3],a[(k+2)%3]];}
function newGame(diff,demo,cfg){
  if(!cfg)cfg={team0:rot3(ACES.map(id=>CH[id]),Math.floor(rnd(0,3))),st:STAGES[Math.floor(rnd(0,3))]};
  S={mode:'serve',diff,demo,score:[0,0],energy:[0,0],server:0,t:0,timer:0,freeze:0,shake:0,fx:[],pops:[],rallyTouches:0,winner:-1,
     cut:null,flash:0,slowT:0,bolt:0,wall:[0,0],callSel:'open',call:['open','open'],next:[null,null],setter:[null,null],spiker:[null,null],
     tm:[BLUE,{n:cfg.st.team,c:cfg.st.c,s:cfg.st.s}],
     ball:{x:0,y:0,z:0,vx:0,vy:0,vz:0,hitT:-9,lastTeam:0,lastPlayer:null,touches:0,sup:false,ghost:false,trail:[]},
     players:[...cfg.team0.map((c,i)=>mk(0,i,c)),...cfg.st.chars.map((id,i)=>mk(1,i,CH[id]))]};
  setupServe();
  if(scene)buildHeroes();
}
const dir=p=>p.team===0?1:-1;
const home=p=>{const d=dir(p);return p.role===0?{x:-d*5.4,z:0}:p.role===1?{x:-d*1.7,z:1.9}:{x:-d*1.7,z:-1.9};};
const nearest=(arr,pt)=>arr.reduce((a,c)=>Math.hypot(c.x-pt.x,c.z-pt.z)<Math.hypot(a.x-pt.x,a.z-pt.z)?c:a);
const hand=p=>({x:p.x+dir(p)*.3,y:p.y+1.8,z:p.z});
const server=()=>S.players.find(p=>p.team===S.server&&p.role===0);
function setupServe(){
  for(const p of S.players){const h=home(p);p.x=h.x;p.z=h.z;p.y=0;p.vy=0;p.onGround=true;p.swing=0;p.cool=0;p.animT=0;}
  const sv=server();sv.x=-dir(sv)*7.4;sv.z=0;
  const b=S.ball;b.vx=b.vy=b.vz=0;b.lastTeam=S.server;b.lastPlayer=sv;b.touches=0;b.sup=false;b.ghost=false;b.trail.length=0;
  S.mode='serve';S.timer=0;S.rallyTouches=0;S.wall=[0,0];S.next=[null,null];S.setter=[null,null];S.spiker=[null,null];
}

// ---------- звук и музыка ----------
let ac,noiseBuf,bgmTimer=0,bgmStep=0;
function AC(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();}catch(e){}return ac;}
function tone(f,t,d,type,v,slide){
  const A=AC();if(!A)return;
  const o=A.createOscillator(),g=A.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
  g.gain.setValueAtTime(v||.07,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(A.destination);o.start(t);o.stop(t+d+.02);
}
function snd(f,d,type,v,slide){if(mute||S.demo)return;try{const A=AC();if(A)tone(f,A.currentTime,d,type,v,slide);}catch(e){}}
function cheer(){
  if(mute||S.demo)return;const A=AC();if(!A)return;
  if(!noiseBuf){noiseBuf=A.createBuffer(1,A.sampleRate,A.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}
  const s=A.createBufferSource(),f=A.createBiquadFilter(),g=A.createGain(),t=A.currentTime;
  s.buffer=noiseBuf;f.type='bandpass';f.frequency.value=1400;g.gain.setValueAtTime(.001,t);g.gain.linearRampToValueAtTime(.09,t+.15);g.gain.exponentialRampToValueAtTime(.001,t+1.1);
  s.connect(f).connect(g).connect(A.destination);s.start(t);s.stop(t+1.1);
}
function bgm(){ // зацикленная аниме-ритмика: Am – F – C – G
  if(bgmTimer||mute)return;const A=AC();if(!A)return;
  const roots=[57,53,48,55],m=n=>440*Math.pow(2,(n-69)/12);
  bgmTimer=setInterval(()=>{
    if(mute||document.hidden)return;
    const t=A.currentTime+.04,s=bgmStep++,bar=(s>>4)&3,r=roots[bar],t3=bar===0?3:4;
    if(s%4===0)tone(m(r-12),t,.3,'triangle',.08);
    if(s%8===6)tone(m(r-12),t,.15,'triangle',.06);
    tone(m(r+12+[0,t3,7,12,t3+12,12,7,t3][s%8]),t,.15,'square',.022);
    if(s%2===1)tone(9000,t,.03,'square',.008);
    if(s%8===4)tone(180,t,.1,'sine',.09,-100);
  },185);
}

// ---------- эффекты ----------
function pop(w,text,color,size,star){S.pops.push({w,text,color,size:size||30,life:1,star});}
function popScr(x,y,text,color,size,star){S.pops.push({s:[x,y],text,color,size,life:1,star});}
function burst(x,y,z,n,color,sp){
  if(!camera)return;const c=toHud(x,y,z);
  for(let i=0;i<n;i++){const a=rnd(0,6.28),v=rnd(.3,1)*sp;S.fx.push({x:c[0],y:c[1],vx:Math.cos(a)*v,vy:Math.sin(a)*v-60,life:rnd(.25,.6),color,r:rnd(2,6)});}
}

// ---------- мяч ----------
function pred(h){
  const b=S.ball,disc=b.vy*b.vy+2*GB*(b.y-h);if(disc<0)return null;
  const t=(b.vy+Math.sqrt(disc))/GB;return t<0?null:{t,x:b.x+b.vx*t,z:b.z+b.vz*t};
}
function award(team,msg){
  S.score[team]++;TOT.points[team]++;TOT.maxTouches=Math.max(TOT.maxTouches,S.rallyTouches);
  for(const p of S.players)if(p.team===team)act(p,'celebrate',0,1,S.score[team]>=WIN?99:1.6);else if(S.score[team]>=WIN)act(p,'defeat',0,1,99);
  S.energy[team]=Math.min(100,S.energy[team]+12);S.server=team;S.mode='point';S.timer=1.6;S.ball.sup=false;S.ball.ghost=false;
  popScr(640,250,msg,'#fff',54);popScr(640,310,'Очко: '+S.tm[team].n,S.tm[team].c,34);
  snd(880,.35,'sine',.08,-300);cheer();
  if(S.score[team]>=WIN)S.winner=team;
}
function moveBall(dt){
  const b=S.ball,px=b.x;
  b.vy-=GB*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;b.z+=b.vz*dt;
  if(Math.abs(b.z)<HZ+.6){
    if(b.y<NETH){
      if(Math.abs(b.x)<BR){const side=px<0?-1:1;b.x=side*BR;b.vx=-b.vx*.35;b.vz*=.6;b.sup=false;b.ghost=false;}
    }else{
      const dx=b.x,dy=b.y-NETH,dd=Math.hypot(dx,dy);
      if(dd<BR&&dd>0){const nx=dx/dd,ny=dy/dd,vn=b.vx*nx+b.vy*ny;if(vn<0){b.vx-=1.6*vn*nx;b.vy-=1.6*vn*ny;}b.x=nx*BR;b.y=NETH+ny*BR;}
    }
  }
  if(b.y<=BR){
    b.y=BR;
    if(S.mode==='rally'){
      const side=b.x<0?0:1,inb=Math.abs(b.x)<=HX&&Math.abs(b.z)<=HZ;
      burst(b.x,0,b.z,14,'#ffe9a8',220);S.shake=Math.max(S.shake,5);snd(120,.12,'triangle',.12,-60);
      award(inb?1-side:1-b.lastTeam,inb?'В ПЛОЩАДКУ!':'АУТ');
    }
    b.vy=-b.vy*.5;b.vx*=.7;b.vz*=.7;
  }
  b.trail.push(b.x,b.y,b.z);if(b.trail.length>108)b.trail.splice(0,3);
  if(!isFinite(b.x+b.y+b.z+b.vx+b.vy+b.vz))TOT.nan++;
}

// ---------- касания ----------
function act(p,name,from,spd,dur){p.anim=name;p.animFrom=from;p.animSpd=spd;p.animT=dur;p.animNew=true;}
function jump(p){p.vy=JUMPV;p.onGround=false;p.jumpId++;snd(260,.08,'sine',.04,200);}
function launch(tx,ty,tz,t){const b=S.ball;b.vx=(tx-b.x)/t;b.vz=(tz-b.z)/t;b.vy=(ty-b.y+.5*GB*t*t)/t;}
function lob(tx,ty,tz,t){ // низкий контакт сам превращается в навес над сеткой
  const b=S.ball,clears=t=>{const vx=(tx-b.x)/t,vy=(ty-b.y+.5*GB*t*t)/t,tn=-b.x/vx;return !(tn>0&&tn<t)||b.y+vy*tn-.5*GB*tn*tn>NETH+BR+.08;};
  while(!clears(t)&&t<1.8)t+=.04;launch(tx,ty,tz,t);
}
function serve(p,ax,az){
  const b=S.ball,d=dir(p);
  launch(d*[3,5,6.8][ax]+rnd(-.4,.4),BR,[-2.5,0,2.5][az]+rnd(-.5,.5),1.35);
  b.lastTeam=p.team;b.lastPlayer=p;b.touches=0;b.hitT=S.t;b.ghost=false;
  S.mode='rally';S.rallyTouches=0;p.swing=.22;p.cool=.3;act(p,'serve',.95,1.5,.7);snd(300,.1,'square',.06,-120);
}
function tryHit(p,ax,az,sup){
  if(p.cool>0)return false;
  p.swing=.22;p.cool=.3;
  const b=S.ball,h=hand(p),r=Math.hypot(b.x-h.x,b.y-h.y,b.z-h.z)/REACH;
  if(r>1||b.lastPlayer===p)return false;
  contact(p,r<.4?2:r<.75?1:0,ax,az,sup);return true;
}
function contact(p,q,ax,az,sup){
  const b=S.ball,d=dir(p),T=p.team,n=b.lastTeam===T?b.touches+1:1;
  if(n>3){award(1-T,'4 КАСАНИЯ');return;}
  if(b.sup&&b.lastTeam!==T)q=Math.max(0,q-1);
  const air=!p.onGround&&b.y>NETH-.4,attack=air||n===3;
  sup=sup&&air&&S.energy[T]>=100&&p.ch.sp!=='wall';
  const err=q===2?0:q===1?.6:1.8;
  let tx,ty,tz,t;
  if(attack){tx=d*[2.2,4.6,7][ax]+rnd(-err,err);tz=[-2.8,0,2.8][az]+rnd(-err,err);ty=BR;t=air?(sup?.34:[.85,.64,.52][q]):1.25;lob(tx,ty,tz,t);}
  else{
    const st=S.setter[T]||S.players.find(q=>q.team===T&&q.role===1),sk=S.spiker[T]||S.players.find(q=>q.team===T&&q.role===2);
    if(n===1){tx=-d*1.3+rnd(-err,err)*.5;tz=clamp(st.z*.9+rnd(-err,err)*.6,-2.8,2.8);ty=1.9;t=1.3;}
    else{ // пас под вызов: открытая — высоко на край, быстрая — низко в центр, пайп — назад за линию атаки
      const c=S.call[T]||'open';
      if(c==='quick'){tx=-d*1.2;tz=clamp(sk.z*.3,-1.4,1.4);ty=2.9;t=.9;}
      else if(c==='pipe'){tx=-d*4.3;tz=clamp(sk.z*.4,-1.2,1.2);ty=2.9;t=1.4;}
      else{tx=-d*1.8;tz=(sk.z>=0?1:-1)*2.9;ty=3.0;t=1.5;}
      tx+=rnd(-err,err)*.45;tz+=rnd(-err,err)*.45;
    }
    tx=d>0?Math.min(tx,-.7):Math.max(tx,.7);launch(tx,ty,tz,t);
  }
  if(air&&attack)act(p,'spike',.5,sup?1.1:1.4,.8);else if(attack||n===1)act(p,'receive',.12,1.6,.6);else act(p,'set',.15,1.7,.55);
  if(n===1)planAttack(T,p);else if(n===2)S.next[T]=S.spiker[T];else S.next[T]=null;
  b.lastTeam=T;b.lastPlayer=p;b.touches=n;b.sup=sup;b.ghost=sup&&p.ch.sp==='ghost';b.hitT=S.t;
  S.rallyTouches++;if(air)TOT.spikes++;
  S.energy[T]=sup?0:Math.min(100,S.energy[T]+[4,10,22][q]);
  const col=sup?p.ch.col:['#ff8b6b','#ffe066','#7dffb0'][q];
  pop([b.x,b.y+.5,b.z],sup?p.ch.spName+'!':['СЛАБО','ХОРОШО','ИДЕАЛЬНО!'][q],col,sup?46:28,sup||q===2);
  burst(b.x,b.y,b.z,sup?30:6+q*6,col,sup?520:260);
  if(sup){TOT.supers++;if(!S.demo)S.cut={p,t:1.05,dur:1.05,name:p.ch.spName};}
  if(air){S.freeze=sup?.14:q===2?.07:.03;S.shake=Math.max(S.shake,sup?18:3+q*4);snd(sup?90:150+q*40,.16,'sawtooth',.1,-60);}
  else snd(220+q*60,.09,'triangle',.09,-40);
}
function pickAICall(){const r=Math.random(),w=[[.8,.1],[.5,.3],[.3,.35]][S.diff];return r<w[0]?'open':r<w[0]+w[1]?'quick':'pipe';}
function planAttack(T,recv){ // после приёма: кто пасует, кто бьёт и по какому вызову
  const m=S.players.filter(q=>q.team===T);
  S.call[T]=(T===0&&!S.demo)?S.callSel:pickAICall();
  const setter=recv.role===1?m.find(q=>q.role===2):m.find(q=>q.role===1);
  S.setter[T]=setter;S.spiker[T]=m.find(q=>q!==recv&&q!==setter);S.next[T]=setter;
}
function updateAssign(){ // кто принимает мяч, летящий на нашу сторону
  const b=S.ball;if(S.mode!=='rally')return;
  for(const T of[0,1]){
    if(b.lastTeam===T)continue;
    const land=pred(1.8)||pred(BR);
    if(land&&((land.x<0)===(T===0)))S.next[T]=nearest(S.players.filter(q=>q.team===T),land);
  }
}
function updateControl(){ // игрок ведёт того, кто сейчас в деле: принимающего, затем атакующего
  if(S.demo)return;
  const mine=S.players.filter(q=>q.team===0),b=S.ball;let tg=null;
  if(S.mode==='serve')tg=S.server===0?server():mine.find(q=>q.role===0);
  else if(S.mode==='rally'){
    if(b.lastTeam===0&&b.touches>=1&&b.touches<3&&S.spiker[0])tg=S.spiker[0];
    else if(b.lastTeam!==0)tg=S.next[0]||nearest(mine,{x:b.x,z:b.z});
  }
  if(tg)for(const q of mine)q.human=q===tg;
}
function activateWall(p){
  const T=p.team;S.energy[T]=0;S.wall[T]=4;TOT.supers++;
  if(!S.demo)S.cut={p,t:1.05,dur:1.05,name:p.ch.spName};
  snd(200,.3,'sawtooth',.09,200);
}

}

    const s=touchMode?'УДАР — подача  (джойстик: короче/длиннее, дальний/ближний край)':'J — подача   (A/D — короче/длиннее, W/S — дальний/ближний край)';txt(s,640,170,24,'#ffe066','center',800,6);
    plain(touchMode?'После приёма выбери вызов внизу слева и бей по розовому кольцу':'После приёма выбери вызов 1 · 2 · 3 и бей по розовому кольцу',640,202,18,'#ffffff','center',700);}
  if(screen==='play'&&!S.demo){
    const p=S.players.find(q=>q.human)||S.players[0];if(S.energy[0]>=100&&S.mode==='rally'){txt(p.ch.sp==='wall'?'K на земле — СТЕНА!':'K в прыжке — '+p.ch.spName+'!',640,676,26,p.ch.col,'center',900,6);}
    if(touchMode&&S.mode!=='over'){
      for(const b of BTN){const down=Object.values(tb).includes(b.k),ready=b.k!=='sup'||S.energy[0]>=100;
        ctx.globalAlpha=ready?(down?.9:.6):.25;ctx.fillStyle=b.k==='sup'?'#ff4fd8':'#fff';ctx.beginPath();ctx.arc(b.x,b.y,b.r*(down?.92:1),0,7);ctx.fill();ctx.globalAlpha=1;
        ctx.strokeStyle='#10142a';ctx.lineWidth=5;ctx.stroke();txt(b.t,b.x,b.y+b.r*.13,b.r*.3,'#10142a','center',900,0);}
      ctx.globalAlpha=.35;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(joy.id>=0?joy.ox:170,joy.id>=0?joy.oy:560,70,0,7);ctx.fill();
      ctx.globalAlpha=.7;ctx.beginPath();ctx.arc((joy.id>=0?joy.ox:170)+joy.x*70,(joy.id>=0?joy.oy:560)+joy.y*70,32,0,7);ctx.fill();ctx.globalAlpha=1;
    }
    if(S.mode!=='over'){const cs=[['open','1 ОТКРЫТАЯ'],['quick','2 БЫСТРАЯ'],['pipe','3 ПАЙП']];
      plain('ВЫЗОВ АТАКИ (куда пас)',20,630,13,'#ffe066','left',800);
      cs.forEach((c,i)=>{const on=S.callSel===c[0],x=20+i*118;ctx.fillStyle=on?'#ffe066':'rgba(12,8,36,.75)';ctx.fillRect(x,638,112,34);ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.strokeRect(x,638,112,34);
        plain(c[1],x+56,661,15,on?'#10142a':'#fff','center',800);zones.push({x,y:638,w:112,h:34,f:()=>{S.callSel=c[0];}});});}
    if(S.bolt>0&&S.ball.sup&&S.ball.lastPlayer&&S.ball.lastPlayer.ch.sp==='thunder'){const c=toHud(S.ball.x,S.ball.y,S.ball.z);ctx.strokeStyle='#fff';ctx.lineWidth=6;ctx.globalAlpha=Math.min(1,S.bolt*2);ctx.beginPath();let x=c[0]+rnd(-30,30),y=-20;ctx.moveTo(x,y);while(y<c[1]){y+=rnd(30,60);x+=rnd(-40,40);ctx.lineTo(x,y);}ctx.stroke();ctx.globalAlpha=1;}
    if(S.mode==='rally'&&S.ball.sup&&!S.cut)speedLines(640,360,.22,S.ball.lastPlayer&&S.ball.lastPlayer.ch.col||'#fff');
  }
  if(S.cut){
    const c=S.cut,k=1-c.t/c.dur,e=Math.min(1,k*6),ex=1-Math.pow(1-e,3),fade=Math.min(1,c.t*8);
    ctx.save();ctx.globalAlpha=fade;ctx.fillStyle='rgba(8,4,24,.6)';ctx.fillRect(-2000,0,5280,720);
    const o=(1-ex)*300;
    ctx.fillStyle=c.p.ch.col;ctx.beginPath();ctx.moveTo(-300,230-o);ctx.lineTo(1580,150-o);ctx.lineTo(1580,520+o);ctx.lineTo(-300,590+o);ctx.closePath();ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.18)';ctx.beginPath();ctx.moveTo(-300,300);ctx.lineTo(1580,250);ctx.lineTo(1580,300);ctx.lineTo(-300,350);ctx.closePath();ctx.fill();
    speedLines(640,360,.55,'#fff');
    panel(c.p.ch,lerpN(1500,760,ex),120,470,480,50);
    ctx.translate(lerpN(-600,0,ex),0);
    txt(c.name,100,400,150,'#fff','left',900,16);
    txt(c.p.ch.name+' · '+(c.p.ch.sp==='wall'?'ЗАЩИТА':'АТАКА'),110,460,34,'#10142a','left',900,0);
    ctx.restore();ctx.globalAlpha=1;
  }
  if(S.flash>0){ctx.fillStyle=`rgba(255,255,255,${S.flash*.8})`;ctx.fillRect(-2000,0,5280,720);}
  if(screen==='talk'&&talk){
    ctx.fillStyle='rgba(10,6,30,.55)';ctx.fillRect(-2000,0,5280,720);
    const L=talk.lines[talk.i],ch=CH[L[0]],hero=ACES.includes(L[0]);talk.t+=1/60;
    panel(ch,hero?40:820,80,420,440,50);
    ctx.fillStyle='rgba(12,8,36,.92)';ctx.fillRect(60,540,1160,150);ctx.strokeStyle=ch.col;ctx.lineWidth=5;ctx.strokeRect(60,540,1160,150);
    txt(ch.name,90,586,34,ch.col,'left',900,5);
    wrapText(L[1].slice(0,Math.floor(talk.t/.03)),1080,'600 26px system-ui').forEach((ln,i)=>plain(ln,90,626+i*34,26,'#fff','left',600));
    plain('Enter / тап — дальше · Esc — пропустить',1200,682,15,'#9aa5ff','right',600);
    zones.push({x:-2000,y:0,w:5280,h:720,f:talkAdvance});
  }
  if(screen==='select'){
    ctx.fillStyle='rgba(14,8,40,.78)';ctx.fillRect(-2000,0,5280,720);
    txt('ШТОРМ',640,112,110,'#ffe066','center',900,12);
    txt('АНИМЕ-ВОЛЕЙБОЛ 3D · ТУРНИР ИЗ ТРЁХ МАТЧЕЙ',640,156,24,'#ffb3e6','center',900,5);
    ACES.forEach((id,i)=>{const ch=CH[id],cx=330+i*310,on=i===sel,y=on?196:214,h=on?400:370;
      zones.push({x:cx-135,y,w:270,h,f:()=>{sel=i;}});
      ctx.fillStyle=on?ch.col:'rgba(255,255,255,.12)';ctx.fillRect(cx-139,y-4,278,h+8);ctx.fillStyle='#14102e';ctx.fillRect(cx-135,y,270,h);
      panel(ch,cx-120,y+14,240,200,24);
      txt(ch.name,cx,y+256,42,'#fff','center',900,6);
      txt('№'+ch.num,cx,y+288,22,ch.col,'center',900,4);
      txt(ch.spName,cx,y+330,34,ch.col,'center',900,5);
      plain(ch.desc,cx,y+358,16,'#cfd6ff','center',600);
      if(on)plain('Команда: '+rot3(ACES,i).map(id=>CH[id].name).join(' · '),cx,y+384,14,'#fff','center',700);});
    btn(500,624,280,66,'В БОЙ!',beginTournament,'#ffe066');
    plain(touchMode?'Тапни героя, затем «В БОЙ!»':'← → или A/D — выбор · Enter — начать · M — звук',640,712,15,'#cfd6ff','center',600);
    if(best>0)txt('Рекорд: '+best+'/3 матчей',1180,40,22,'#7dffb0','right',900,4);
  }
  if(screen==='vs'){
    const k=Math.min(1,screenT*3),ex=1-Math.pow(1-k,3);
    ctx.fillStyle='rgba(10,6,30,.9)';ctx.fillRect(-2000,0,5280,720);
    const A=S.players[0].ch,B=S.players[3].ch;
    ctx.fillStyle=S.tm[0].c;ctx.beginPath();ctx.moveTo(-300,0);ctx.lineTo(700,0);ctx.lineTo(560,720);ctx.lineTo(-300,720);ctx.fill();
    ctx.fillStyle=S.tm[1].c;ctx.beginPath();ctx.moveTo(720,0);ctx.lineTo(1580,0);ctx.lineTo(1580,720);ctx.lineTo(580,720);ctx.fill();
    speedLines(640,360,.3,'#fff');
    panel(A,lerpN(-500,90,ex),150,420,430,50);panel(B,lerpN(1780,770,ex),150,420,430,50);
    txt(S.tm[0].n,300,640,50,'#fff','center',900,8);txt(S.tm[1].n,980,640,50,'#fff','center',900,8);
    txt('VS',640,380,140,'#ffe066','center',900,14);
    txt(`МАТЧ ${stage+1} / 3`,640,90,44,'#fff','center',900,8);
    txt(S.players.slice(0,3).map(q=>q.ch.name).join(' · '),300,120,24,'#fff','center',900,5);txt(S.players.slice(3).map(q=>q.ch.name).join(' · '),980,120,24,'#fff','center',900,5);
    plain(DIFF[S.diff].name+(B.boss?' · БОСС':''),980,676,22,'#fff','center',700);
    if(screenT>2.6)screen='play';
  }
  if(screen==='play'&&S.mode==='over'){
    ctx.fillStyle='rgba(8,4,24,.72)';ctx.fillRect(-2000,0,5280,720);const win=S.winner===0;
    txt(win?'ПОБЕДА!':'ПОРАЖЕНИЕ',640,300,120,win?'#7dffb0':'#ff8b6b','center',900,12);
    txt(S.score[0]+' : '+S.score[1],640,400,64,'#fff','center',900,8);
    plain(win?(stage+1>=STAGES.length?'Enter / тап — к финалу':'Enter / тап — следующий матч'):'Enter / тап — реванш · Esc — выбор героя',640,470,26,'#cfe6ff','center',700);
  }
  if(screen==='champ'){
    ctx.fillStyle='rgba(14,8,40,.7)';ctx.fillRect(-2000,0,5280,720);
    panel(CH[ACES[sel]],450,30,380,320,40);
    txt('ЧЕМПИОН!',640,480,110,'#ffe066','center',900,12);
    txt('Ты прошёл турнир за '+CH[ACES[sel]].name,640,535,30,'#fff','center',900,6);
    btn(330,585,300,66,'ПОДЕЛИТЬСЯ',share,'#7fe0ff');btn(660,585,300,66,'ЕЩЁ РАЗ',toSelect,'#ffe066');
  }
  if(innerHeight>innerWidth*1.1){ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='rgba(8,4,24,.92)';ctx.fillRect(0,0,hud.width,hud.height);
    ctx.fillStyle='#ffe066';ctx.font='900 26px system-ui,sans-serif';ctx.textAlign='center';ctx.fillText('Поверни телефон горизонтально',hud.width/2,hud.height/2);}
}

// ---------- ввод ----------
const unlock=()=>{AC();bgm();};
addEventListener('keydown',e=>{
  if(e.repeat)return;
  keys[e.code]=true;unlock();
  if(['Space','ArrowUp','ArrowLeft','ArrowRight','ArrowDown'].includes(e.code))e.preventDefault();
  if(e.code==='KeyM'){mute=!mute;return;}
  if(screen==='select'){
    if(e.code==='ArrowLeft'||e.code==='KeyA')sel=(sel+2)%3;
    else if(e.code==='ArrowRight'||e.code==='KeyD')sel=(sel+1)%3;
    else if(/^(Digit|Numpad)[123]$/.test(e.code))sel=+e.code.slice(-1)-1;
    else if(e.code==='Enter'||e.code==='KeyJ'||e.code==='Space')beginTournament();
    return;}
  if(screen==='talk'){if(e.code==='Enter'||e.code==='Space'||e.code==='KeyJ')talkAdvance();else if(e.code==='Escape')toSelect();return;}
  if(screen==='vs'){screenT=Math.max(screenT,2.4);return;}
  if(screen==='champ'){if(e.code==='Enter'||e.code==='Space')toSelect();if(e.code==='KeyC')share();return;}
  if(screen==='play'){
    if(e.code==='Escape'){toSelect();return;}
    if(S.mode==='over'&&(e.code==='Enter'||e.code==='Space')){afterOver();return;}
    if(e.code==='KeyJ')input.hit=true;if(e.code==='KeyK')input.sup=true;
    if(e.code==='Digit1')S.callSel='open';if(e.code==='Digit2')S.callSel='quick';if(e.code==='Digit3')S.callSel='pipe';}
});
addEventListener('keyup',e=>{keys[e.code]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;joy.id=-1;joy.x=joy.y=0;});
const vpt=e=>[(e.clientX-OX)/U,(e.clientY-OY)/U];
hud.addEventListener('pointerdown',e=>{
  e.preventDefault();unlock();if(e.pointerType==='touch')touchMode=true;
  const[x,y]=vpt(e);
  for(const z of zones)if(x>=z.x&&x<=z.x+z.w&&y>=z.y&&y<=z.y+z.h){z.f();return;}
  if(screen==='vs'){screenT=Math.max(screenT,2.4);return;}
  if(screen!=='play')return;
  if(S.mode==='over'){afterOver();return;}
  for(const b of BTN)if(touchMode&&Math.hypot(x-b.x,y-b.y)<b.r*1.2){
    tb[e.pointerId]=b.k;hud.setPointerCapture(e.pointerId);
    if(b.k==='hit')input.hit=true;else if(b.k==='sup')input.sup=true;else keys.Space=true;return;}
  if(touchMode&&x<760&&joy.id<0){joy.id=e.pointerId;joy.ox=x;joy.oy=y;joy.x=joy.y=0;hud.setPointerCapture(e.pointerId);}
});
hud.addEventListener('pointermove',e=>{
  if(e.pointerId!==joy.id)return;const[x,y]=vpt(e);let dx=(x-joy.ox)/70,dy=(y-joy.oy)/70;const m=Math.hypot(dx,dy);if(m>1){dx/=m;dy/=m;}joy.x=dx;joy.y=dy;});
const up=e=>{if(e.pointerId===joy.id){joy.id=-1;joy.x=joy.y=0;}if(tb[e.pointerId]==='jump')keys.Space=false;delete tb[e.pointerId];};
hud.addEventListener('pointerup',up);hud.addEventListener('pointercancel',up);

// ---------- цикл ----------
if(typeof THREE==='undefined'){
  hud.width=innerWidth;hud.height=innerHeight;ctx.fillStyle='#fff';ctx.font='24px system-ui';ctx.textAlign='center';
  ctx.fillText('Не загрузилась библиотека three.js — нужен интернет. Подключись и обнови страницу.',innerWidth/2,innerHeight/2);
}else{
  hud.width=innerWidth;hud.height=innerHeight;ctx.fillStyle='#fff';ctx.font='28px system-ui';ctx.textAlign='center';ctx.fillText('Загрузка героев…',innerWidth/2,innerHeight/2);
  loadChars().then(()=>{
  makePortraits();initScene();addEventListener('resize',resize);
  let last=0,acc=0;
  const frame=ts=>{
    const real=Math.min(.05,(ts-last)/1000||0);last=ts;screenT+=real;
    const k=S.slowT>0?.3:1;S.slowT=Math.max(0,S.slowT-real);acc+=real*k;
    if(screen!=='vs')while(acc>=STEP){step(STEP);acc-=STEP;}else acc=0;
    S.flash=Math.max(0,S.flash-real*3);
    render3d(real);drawHud();requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
  });
}
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
